[workspace]
resolver = "2"
members = [
    "crates/sdk",
    "crates/core",
    "plugins/control",
    "crates/fixture-module",
    "crates/platform",
    "crates/packages",
    "plugins/screenshot",
    "plugins/translator",
    "plugins/translator/providers",
    "apps/desktop",
    "examples/echo-plugin",
]

[workspace.package]
version = "0.4.19"
edition = "2021"
license = "proprietary"
rust-version = "1.90"

[workspace.dependencies]
util-maker-sdk = { path = "crates/sdk" }
util-maker-core = { path = "crates/core" }
util-maker-platform = { path = "crates/platform" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
semver = "1.0"

[profile.release]
lto = false
codegen-units = 16
opt-level = "s"
strip = true
