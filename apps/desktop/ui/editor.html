<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Редактировать снимок</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #11151f; color: #e8ecf6; overflow: hidden; font: 13px "Segoe UI", sans-serif; }
      body { display: grid; grid-template-rows: 56px 1fr 64px; }
      #topbar { display: flex; align-items: center; gap: 5px; padding: 0 10px; background: #1a2030; border-bottom: 1px solid #2c3550; }
      #topbar .sep { width: 1px; height: 28px; background: #2c3550; margin: 0 6px; }
      #title { font-weight: 600; margin-right: 8px; white-space: nowrap; }
      .tool { width: 38px; height: 38px; display: grid; place-items: center; padding: 0; }
      .tool svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      button { font: inherit; border-radius: 7px; border: 1px solid #3a4668; background: #232c42; color: inherit; cursor: pointer; }
      button:hover { background: #2c3650; }
      button.active { background: #6b9bff; color: #0b1020; border-color: #6b9bff; }
      button:disabled { opacity: .4; cursor: default; }
      .swatches { display: flex; gap: 6px; align-items: center; margin-left: 2px; }
      .swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #3a4668; padding: 0; }
      .swatch.active { outline: 2px solid #fff; outline-offset: 1px; }
      #color { width: 30px; height: 28px; border: 0; background: transparent; padding: 0; cursor: pointer; }
      #stage { display: flex; align-items: center; justify-content: center; overflow: hidden; background: #0b0f18; }
      canvas { display: block; max-width: calc(100% - 24px); max-height: calc(100% - 24px); cursor: crosshair; box-shadow: 0 0 0 1px #2c3550; }
      #bottombar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #1a2030; border-top: 1px solid #2c3550; }
      #status { color: #9aa8c7; font-size: 12px; margin-right: auto; }
      #bottombar .primary { background: #6b9bff; color: #0b1020; border-color: #6b9bff; }
      #bottombar button { padding: 8px 14px; }
    </style>
  </head>
  <body>
    <div id="topbar">
      <span id="title">Редактор снимка</span>
      <button class="tool" data-tool="arrow" title="Стрелка" aria-label="Стрелка">
        <svg viewBox="0 0 24 24"><path d="M4 20 20 4M11 4h9v9"/></svg>
      </button>
      <button class="tool" data-tool="rect" title="Прямоугольник" aria-label="Прямоугольник">
        <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg>
      </button>
      <button class="tool" data-tool="ellipse" title="Эллипс" aria-label="Эллипс">
        <svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="7"/></svg>
      </button>
      <button class="tool" data-tool="line" title="Линия" aria-label="Линия">
        <svg viewBox="0 0 24 24"><path d="M4 20 20 4"/></svg>
      </button>
      <span class="sep"></span>
      <button class="tool" id="undo" title="Отменить последнюю фигуру" aria-label="Отменить последнюю фигуру" disabled>
        <svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M4 12h9a6 6 0 1 1 0 12"/></svg>
      </button>
      <button class="tool" id="clear" title="Очистить все фигуры" aria-label="Очистить все фигуры" disabled>
        <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>
      </button>
      <span class="sep"></span>
      <div class="swatches" id="swatches" aria-label="Цвет инструмента">
        <button class="swatch active" data-color="#ff4d4d" style="background:#ff4d4d" title="Красный" aria-label="Красный"></button>
        <button class="swatch" data-color="#ffd21f" style="background:#ffd21f" title="Жёлтый" aria-label="Жёлтый"></button>
        <button class="swatch" data-color="#4f8cff" style="background:#4f8cff" title="Синий" aria-label="Синий"></button>
        <button class="swatch" data-color="#37d67a" style="background:#37d67a" title="Зелёный" aria-label="Зелёный"></button>
        <button class="swatch" data-color="#ffffff" style="background:#ffffff" title="Белый" aria-label="Белый"></button>
        <input id="color" type="color" value="#ff4d4d" title="Свой цвет" aria-label="Свой цвет" />
      </div>
    </div>
    <div id="stage"><canvas id="screen"></canvas></div>
    <div id="bottombar">
      <span id="status">Выберите инструмент и рисуйте. Esc — закрыть.</span>
      <button id="copy" type="button">Копировать</button>
      <button id="save" class="primary" type="button">Сохранить</button>
      <button id="close" type="button">Закрыть</button>
    </div>
    <script>
      const invoke = (command, args) => window.__TAURI__.core.invoke(command, args);
      const params = new URLSearchParams(location.search);
      const source = { x: Number(params.get("x")) || 0, y: Number(params.get("y")) || 0, w: Math.max(1, Number(params.get("w")) || 1), h: Math.max(1, Number(params.get("h")) || 1) };
      const canvas = document.getElementById("screen");
      const context = canvas.getContext("2d", { willReadFrequently: true });
      const status = document.getElementById("status");
      let imageData = null;
      let annotations = [];
      let mode = null;
      let color = "#ff4d4d";
      let drag = null;

      function drawAnnotation(target, item) {
        target.strokeStyle = item.color;
        target.lineWidth = 3;
        target.beginPath();
        if (item.type === "arrow") {
          target.moveTo(item.x1, item.y1);
          target.lineTo(item.x2, item.y2);
          const angle = Math.atan2(item.y2 - item.y1, item.x2 - item.x1);
          for (const offset of [Math.PI / 7, -Math.PI / 7]) {
            target.moveTo(item.x2, item.y2);
            target.lineTo(item.x2 - 14 * Math.cos(angle + offset), item.y2 - 14 * Math.sin(angle + offset));
          }
        } else if (item.type === "rect") {
          target.rect(item.x1, item.y1, item.x2 - item.x1, item.y2 - item.y1);
        } else if (item.type === "line") {
          target.moveTo(item.x1, item.y1);
          target.lineTo(item.x2, item.y2);
        } else if (item.type === "ellipse") {
          target.ellipse((item.x1 + item.x2) / 2, (item.y1 + item.y2) / 2, Math.abs(item.x2 - item.x1) / 2, Math.abs(item.y2 - item.y1) / 2, 0, 0, Math.PI * 2);
        }
        target.stroke();
      }

      function draw() {
        if (!imageData) return;
        context.putImageData(imageData, 0, 0);
        for (const item of annotations) drawAnnotation(context, item);
      }

      function point(event) {
        const rect = canvas.getBoundingClientRect();
        return { x: (event.clientX - rect.left) * (canvas.width / rect.width), y: (event.clientY - rect.top) * (canvas.height / rect.height) };
      }
      canvas.addEventListener("mousedown", (event) => {
        if (!mode) return;
        const p = point(event);
        drag = { type: mode, color, x1: p.x, y1: p.y, x2: p.x, y2: p.y };
      });
      canvas.addEventListener("mousemove", (event) => {
        if (!drag) return;
        const p = point(event);
        drag.x2 = p.x; drag.y2 = p.y;
        draw();
        drawAnnotation(context, drag);
      });
      canvas.addEventListener("mouseup", () => {
        if (!drag) return;
        if (Math.abs(drag.x2 - drag.x1) > 2 || Math.abs(drag.y2 - drag.y1) > 2) annotations.push({ ...drag });
        drag = null;
        updateButtons();
        draw();
      });
      canvas.addEventListener("contextmenu", (event) => event.preventDefault());

      function updateButtons() {
        document.getElementById("undo").disabled = annotations.length === 0;
        document.getElementById("clear").disabled = annotations.length === 0;
      }
      function setMode(next) {
        mode = mode === next ? null : next;
        for (const button of document.querySelectorAll("[data-tool]")) button.classList.toggle("active", button.dataset.tool === mode);
      }
      for (const button of document.querySelectorAll("[data-tool]")) button.addEventListener("click", () => setMode(button.dataset.tool));
      document.getElementById("undo").onclick = () => { annotations.pop(); updateButtons(); draw(); };
      document.getElementById("clear").onclick = () => { annotations = []; updateButtons(); draw(); };
      for (const swatch of document.querySelectorAll(".swatch")) swatch.addEventListener("click", () => {
        color = swatch.dataset.color;
        document.getElementById("color").value = color;
        for (const item of document.querySelectorAll(".swatch")) item.classList.toggle("active", item === swatch);
      });
      document.getElementById("color").addEventListener("input", (event) => {
        color = event.target.value;
        for (const item of document.querySelectorAll(".swatch")) item.classList.remove("active");
      });

      function compose() {
        const out = document.createElement("canvas");
        out.width = canvas.width; out.height = canvas.height;
        const target = out.getContext("2d", { willReadFrequently: true });
        target.putImageData(imageData, 0, 0);
        for (const item of annotations) drawAnnotation(target, item);
        return out;
      }
      function rgbaHex(canvasElement) {
        const data = canvasElement.getContext("2d", { willReadFrequently: true }).getImageData(0, 0, canvasElement.width, canvasElement.height).data;
        let hex = "";
        for (const value of data) hex += value.toString(16).padStart(2, "0");
        return hex;
      }
      async function copy() {
        if (!imageData) return;
        const out = compose();
        try {
          await invoke("copy_overlay_image", { width: out.width, height: out.height, rgba: rgbaHex(out) });
          status.textContent = "Скопировано в буфер";
          await invoke("close_overlay");
        } catch (error) { status.textContent = `Не удалось скопировать: ${error}`; }
      }
      async function save() {
        if (!imageData) return;
        const out = compose();
        try {
          const path = await invoke("save_editor_image", { width: out.width, height: out.height, rgba: rgbaHex(out) });
          status.textContent = `Сохранено: ${path}`;
        } catch (error) { status.textContent = `Не удалось сохранить: ${error}`; }
      }
      document.getElementById("copy").onclick = copy;
      document.getElementById("save").onclick = save;
      document.getElementById("close").onclick = () => invoke("close_overlay");
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") invoke("close_overlay");
        else if (event.ctrlKey && event.key.toLowerCase() === "c") { event.preventDefault(); copy(); }
        else if (event.ctrlKey && event.key.toLowerCase() === "s") { event.preventDefault(); save(); }
      });

      (async () => {
        try {
          canvas.width = source.w; canvas.height = source.h;
          const dataUrl = await invoke("get_editor_image", { x: source.x, y: source.y, width: source.w, height: source.h });
          const image = new Image(); image.src = dataUrl; await image.decode();
          context.drawImage(image, 0, 0);
          imageData = context.getImageData(0, 0, source.w, source.h);
        } catch (error) { status.textContent = `Не удалось загрузить снимок: ${error}`; }
        window.focus();
      })();
    </script>
  </body>
</html>
