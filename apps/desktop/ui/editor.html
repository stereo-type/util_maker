<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Редактировать снимок</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #11151f; color: #e8ecf6; overflow: hidden; font: 13px "Segoe UI", sans-serif; }
      #stage { position: absolute; inset: 0 0 64px 0; display: flex; align-items: center; justify-content: center; overflow: auto; background: #0b0f18; }
      canvas { display: block; cursor: crosshair; box-shadow: 0 0 0 1px #2c3550; }
      #toolbar { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; display: flex; gap: 7px; align-items: center; padding: 8px; background: #1a2030; border-top: 1px solid #2c3550; }
      button { font: inherit; padding: 7px 10px; border-radius: 6px; border: 1px solid #3a4668; background: #232c42; color: inherit; cursor: pointer; }
      button.active { background: #6b9bff; color: #0b1020; }
      button:disabled { opacity: .45; cursor: default; }
      #status { margin-left: auto; color: #9aa8c7; font-size: 12px; }
      #close { margin-left: 4px; }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="screen"></canvas></div>
    <div id="toolbar">
      <button id="arrow" type="button">Стрелка</button>
      <button id="rect" type="button">Рамка</button>
      <button id="ellipse" type="button">Эллипс</button>
      <button id="undo" type="button" disabled>Отменить</button>
      <button id="copy" type="button">Копировать</button>
      <span id="status">Ctrl+C или Enter — копировать</span>
      <button id="close" type="button">Закрыть</button>
    </div>
    <script>
      const invoke = (command, args) => window.__TAURI__.core.invoke(command, args);
      const params = new URLSearchParams(location.search);
      const source = { x: Number(params.get("x")) || 0, y: Number(params.get("y")) || 0, w: Math.max(1, Number(params.get("w")) || 1), h: Math.max(1, Number(params.get("h")) || 1) };
      const canvas = document.getElementById("screen");
      const context = canvas.getContext("2d", { willReadFrequently: true });
      const status = document.getElementById("status");
      let imageData = null;
      let annotations = [];
      let mode = null;
      let drag = null;

      function draw() {
        if (!imageData) return;
        context.putImageData(imageData, 0, 0);
        for (const item of annotations) {
          context.strokeStyle = "#ff5a5f";
          context.lineWidth = 3;
          context.beginPath();
          if (item.type === "arrow") {
            context.moveTo(item.x1, item.y1);
            context.lineTo(item.x2, item.y2);
            const angle = Math.atan2(item.y2 - item.y1, item.x2 - item.x1);
            for (const offset of [Math.PI / 7, -Math.PI / 7]) {
              context.moveTo(item.x2, item.y2);
              context.lineTo(item.x2 - 14 * Math.cos(angle + offset), item.y2 - 14 * Math.sin(angle + offset));
            }
          } else if (item.type === "rect") {
            context.rect(item.x1, item.y1, item.x2 - item.x1, item.y2 - item.y1);
          } else {
            const cx = (item.x1 + item.x2) / 2, cy = (item.y1 + item.y2) / 2;
            context.ellipse(cx, cy, Math.abs(item.x2 - item.x1) / 2, Math.abs(item.y2 - item.y1) / 2, 0, 0, Math.PI * 2);
          }
          context.stroke();
        }
      }

      function point(event) {
        const rect = canvas.getBoundingClientRect();
        return { x: (event.clientX - rect.left) * (canvas.width / rect.width), y: (event.clientY - rect.top) * (canvas.height / rect.height) };
      }
      canvas.addEventListener("mousedown", (event) => {
        if (!mode) return;
        const p = point(event);
        drag = { type: mode, x1: p.x, y1: p.y, x2: p.x, y2: p.y };
      });
      canvas.addEventListener("mousemove", (event) => {
        if (!drag) return;
        const p = point(event);
        drag.x2 = p.x; drag.y2 = p.y;
        draw();
        context.strokeStyle = "#ff5a5f"; context.lineWidth = 3; context.beginPath();
        if (drag.type === "arrow") { context.moveTo(drag.x1, drag.y1); context.lineTo(drag.x2, drag.y2); }
        else if (drag.type === "rect") context.rect(drag.x1, drag.y1, drag.x2 - drag.x1, drag.y2 - drag.y1);
        else context.ellipse((drag.x1 + drag.x2) / 2, (drag.y1 + drag.y2) / 2, Math.abs(drag.x2 - drag.x1) / 2, Math.abs(drag.y2 - drag.y1) / 2, 0, 0, Math.PI * 2);
        context.stroke();
      });
      canvas.addEventListener("mouseup", () => {
        if (!drag) return;
        if (Math.abs(drag.x2 - drag.x1) > 2 || Math.abs(drag.y2 - drag.y1) > 2) annotations.push(drag);
        drag = null;
        document.getElementById("undo").disabled = annotations.length === 0;
        draw();
      });
      canvas.addEventListener("contextmenu", (event) => event.preventDefault());

      function setMode(next) {
        mode = mode === next ? null : next;
        for (const id of ["arrow", "rect", "ellipse"]) document.getElementById(id).classList.toggle("active", id === mode);
      }
      document.getElementById("arrow").onclick = () => setMode("arrow");
      document.getElementById("rect").onclick = () => setMode("rect");
      document.getElementById("ellipse").onclick = () => setMode("ellipse");
      document.getElementById("undo").onclick = () => { annotations.pop(); document.getElementById("undo").disabled = annotations.length === 0; draw(); };
      document.getElementById("close").onclick = () => invoke("close_overlay");

      async function copy() {
        if (!imageData) return;
        const out = document.createElement("canvas");
        out.width = canvas.width; out.height = canvas.height;
        const target = out.getContext("2d");
        target.putImageData(imageData, 0, 0);
        for (const item of annotations) {
          target.strokeStyle = "#ff5a5f"; target.lineWidth = 3; target.beginPath();
          if (item.type === "arrow") {
            target.moveTo(item.x1, item.y1); target.lineTo(item.x2, item.y2);
            const angle = Math.atan2(item.y2 - item.y1, item.x2 - item.x1);
            for (const offset of [Math.PI / 7, -Math.PI / 7]) {
              target.moveTo(item.x2, item.y2);
              target.lineTo(item.x2 - 14 * Math.cos(angle + offset), item.y2 - 14 * Math.sin(angle + offset));
            }
          } else if (item.type === "rect") target.rect(item.x1, item.y1, item.x2 - item.x1, item.y2 - item.y1);
          else target.ellipse((item.x1 + item.x2) / 2, (item.y1 + item.y2) / 2, Math.abs(item.x2 - item.x1) / 2, Math.abs(item.y2 - item.y1) / 2, 0, 0, Math.PI * 2);
          target.stroke();
        }
        const data = target.getImageData(0, 0, out.width, out.height).data;
        let hex = "";
        for (const value of data) hex += value.toString(16).padStart(2, "0");
        try {
          await invoke("copy_overlay_image", { width: out.width, height: out.height, rgba: hex });
          status.textContent = "Скопировано";
          await invoke("close_overlay");
        } catch (error) {
          status.textContent = `Не удалось скопировать: ${error}`;
        }
      }
      document.getElementById("copy").onclick = copy;
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") invoke("close_overlay");
        else if ((event.ctrlKey && event.key.toLowerCase() === "c") || event.key === "Enter") copy();
      });

      (async () => {
        try {
          canvas.width = source.w;
          canvas.height = source.h;
          const dataUrl = await invoke("get_editor_image", {
            x: source.x, y: source.y, width: source.w, height: source.h,
          });
          const image = new Image();
          image.src = dataUrl;
          await image.decode();
          context.drawImage(image, 0, 0);
          imageData = context.getImageData(0, 0, source.w, source.h);
        } catch (error) {
          status.textContent = `Не удалось загрузить снимок: ${error}`;
        }
        window.focus();
      })();
    </script>
  </body>
</html>
