<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Снять область</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent !important; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
      #coords {
        position: fixed; z-index: 2; top: 14px; left: 14px; color: #fff;
        background: rgba(16,20,30,.86); border-radius: 6px; padding: 5px 8px;
        font: 12.5px "Segoe UI", sans-serif; pointer-events: none; white-space: nowrap;
      }
      #cancel {
        position: fixed; top: 12px; right: 14px; z-index: 2;
        font: 13px "Segoe UI", sans-serif; padding: 7px 12px;
        border-radius: 7px; border: 1px solid #3a4668; background: #232c42; color: #e8ecf6; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <div id="coords">0, 0</div>
    <button id="cancel" type="button">Отмена</button>
    <script>
      const invoke = (command, args) => window.__TAURI__.core.invoke(command, args);
      const mode = new URLSearchParams(window.location.search).get("mode");
      const submitCommand = mode === "qr" ? "qr_read_region" : "open_screenshot_editor";
      const canvas = document.getElementById("screen");
      const context = canvas.getContext("2d");
      const coords = document.getElementById("coords");
      const dpr = window.devicePixelRatio || 1;
      const DIM = "rgba(8, 12, 22, 0.45)";
      let origin = { x: 0, y: 0, width: 0, height: 0 };
      let image = null;
      let drag = null;
      let selection = null;
      let opening = false;

      function resizeToWindow() {
        if (image) return;
        canvas.width = Math.max(1, Math.round(window.innerWidth * dpr));
        canvas.height = Math.max(1, Math.round(window.innerHeight * dpr));
        draw();
      }
      window.addEventListener("resize", resizeToWindow);

      function draw() {
        context.clearRect(0, 0, canvas.width, canvas.height);
        if (image) {
          context.imageSmoothingEnabled = false;
          context.drawImage(image, 0, 0, canvas.width, canvas.height);
        } else {
          context.fillStyle = "rgba(8, 12, 22, 0.35)";
          context.fillRect(0, 0, canvas.width, canvas.height);
        }
        if (selection && selection.w > 0 && selection.h > 0) {
          const right = selection.x + selection.w;
          const bottom = selection.y + selection.h;
          context.fillStyle = DIM;
          context.fillRect(0, 0, canvas.width, selection.y);
          context.fillRect(0, bottom, canvas.width, canvas.height - bottom);
          context.fillRect(0, selection.y, selection.x, selection.h);
          context.fillRect(right, selection.y, canvas.width - right, selection.h);
          context.save();
          context.strokeStyle = "#4f8cff";
          context.lineWidth = Math.max(2, Math.round((canvas.width / 1920) * 2));
          context.setLineDash([]);
          context.strokeRect(selection.x, selection.y, selection.w, selection.h);
          context.restore();
        } else if (image) {
          context.fillStyle = "rgba(8, 12, 22, 0.25)";
          context.fillRect(0, 0, canvas.width, canvas.height);
        }
      }

      function point(event) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: (event.clientX - rect.left) * (canvas.width / rect.width),
          y: (event.clientY - rect.top) * (canvas.height / rect.height),
        };
      }

      canvas.addEventListener("mousedown", (event) => {
        if (event.button !== 0 || opening) return;
        const p = point(event);
        drag = { x: p.x, y: p.y };
        selection = { x: p.x, y: p.y, w: 0, h: 0 };
        draw();
      });
      canvas.addEventListener("mousemove", (event) => {
        const p = point(event);
        coords.textContent = `${Math.round(origin.x + p.x)}, ${Math.round(origin.y + p.y)}`;
        if (!drag) return;
        selection = {
          x: Math.min(drag.x, p.x), y: Math.min(drag.y, p.y),
          w: Math.abs(p.x - drag.x), h: Math.abs(p.y - drag.y),
        };
        draw();
      });
      canvas.addEventListener("mouseup", () => {
        if (!drag || !selection) return;
        drag = null;
        if (selection.w < 3 || selection.h < 3) {
          selection = null;
          draw();
          return;
        }
        opening = true;
        const args = {
          x: Math.round(selection.x), y: Math.round(selection.y),
          width: Math.max(1, Math.round(selection.w)), height: Math.max(1, Math.round(selection.h)),
        };
        invoke(submitCommand, args)
          .then(() => {
            if (mode === "qr") invoke("close_overlay");
          })
          .catch((error) => {
            opening = false;
            selection = null;
            coords.textContent = `Не удалось обработать область: ${error}`;
            draw();
          });
      });
      canvas.addEventListener("contextmenu", (event) => event.preventDefault());

      function cancel() { invoke("close_overlay"); }
      document.getElementById("cancel").addEventListener("click", cancel);
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") cancel();
        if (event.key === "Enter" && selection) {
          const args = { x: Math.round(selection.x), y: Math.round(selection.y), width: Math.round(selection.w), height: Math.round(selection.h) };
          invoke(submitCommand, args).then(() => {
            if (mode === "qr") invoke("close_overlay");
          });
        }
      });

      async function loadOverlay() {
        resizeToWindow();
        try {
          origin = await invoke("get_overlay_geometry");
        } catch (_) {}
        try {
          const url = await invoke("get_overlay_frame");
          const frame = new Image();
          frame.src = url;
          await frame.decode();
          image = frame;
          canvas.width = frame.naturalWidth;
          canvas.height = frame.naturalHeight;
        } catch (error) {
          coords.textContent = `Не удалось получить кадр: ${error}`;
        }
        draw();
        window.focus();
      }

      loadOverlay();
    </script>
  </body>
</html>
