<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Снять область</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
      #toolbar {
        position: fixed; left: 16px; bottom: 16px; z-index: 2;
        display: flex; gap: 8px; align-items: center;
        background: #1a2030; color: #e8ecf6; border: 1px solid #2c3550;
        border-radius: 10px; padding: 8px; font: 13px "Segoe UI", sans-serif;
      }
      button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid #3a4668; background: #232c42; color: inherit; cursor: pointer; }
      button.active { background: #6b9bff; color: #0b1020; }
      button:disabled { opacity: .45; cursor: default; }
      #hint { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 2; color: #fff; background: rgba(16,20,30,.8); padding: 7px 12px; border-radius: 8px; font: 13px "Segoe UI", sans-serif; }
    </style>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <div id="hint">Выделите область мышью. Enter — копировать, Esc — отмена.</div>
    <div id="toolbar">
      <button id="select" class="active" type="button">Область</button>
      <button id="arrow" type="button">Стрелка</button>
      <button id="rect" type="button">Рамка</button>
      <button id="undo" type="button" disabled>Отменить</button>
      <button id="copy" type="button" disabled>Копировать</button>
      <button id="cancel" type="button">Отмена</button>
    </div>
    <script>
      const invoke = (command, args) => window.__TAURI__.core.invoke(command, args);
      const canvas = document.getElementById("screen");
      const context = canvas.getContext("2d", { willReadFrequently: true });
      let image = null;
      let selection = null;
      let annotations = [];
      let mode = "select";
      let drag = null;
      let base = null;

      function draw() {
        context.clearRect(0, 0, canvas.width, canvas.height);
        if (image) context.drawImage(image, 0, 0);
        if (selection) {
          context.save();
          context.fillStyle = "rgba(0,0,0,0.45)";
          context.fillRect(0, 0, canvas.width, canvas.height);
          context.clearRect(selection.x, selection.y, selection.w, selection.h);
          context.drawImage(image, selection.x * (image.width / canvas.width), selection.y * (image.height / canvas.height),
            selection.w * (image.width / canvas.width), selection.h * (image.height / canvas.height),
            selection.x, selection.y, selection.w, selection.h);
          context.strokeStyle = "#6b9bff";
          context.lineWidth = 2;
          context.strokeRect(selection.x, selection.y, selection.w, selection.h);
          context.restore();
        }
        for (const annotation of annotations) {
          context.strokeStyle = "#ff4d4d";
          context.lineWidth = 3;
          context.beginPath();
          if (annotation.type === "arrow") {
            context.moveTo(annotation.x1, annotation.y1);
            context.lineTo(annotation.x2, annotation.y2);
            const angle = Math.atan2(annotation.y2 - annotation.y1, annotation.x2 - annotation.x1);
            for (const offset of [Math.PI / 7, -Math.PI / 7]) {
              context.moveTo(annotation.x2, annotation.y2);
              context.lineTo(annotation.x2 - 14 * Math.cos(angle + offset), annotation.y2 - 14 * Math.sin(angle + offset));
            }
          } else {
            context.rect(annotation.x1, annotation.y1, annotation.x2 - annotation.x1, annotation.y2 - annotation.y1);
          }
          context.stroke();
        }
      }

      function point(event) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: (event.clientX - rect.left) * (canvas.width / rect.width),
          y: (event.clientY - rect.top) * (canvas.height / rect.height),
        };
      }

      canvas.addEventListener("mousedown", (event) => {
        const p = point(event);
        if (mode === "select") {
          selection = { x: p.x, y: p.y, w: 0, h: 0 };
          drag = { kind: "select", x: p.x, y: p.y };
        } else {
          drag = { kind: mode, x1: p.x, y1: p.y, x2: p.x, y2: p.y };
        }
        draw();
      });
      canvas.addEventListener("mousemove", (event) => {
        if (!drag) return;
        const p = point(event);
        if (drag.kind === "select") {
          selection = { x: Math.min(drag.x, p.x), y: Math.min(drag.y, p.y), w: Math.abs(p.x - drag.x), h: Math.abs(p.y - drag.y) };
        } else {
          drag.x2 = p.x; drag.y2 = p.y;
        }
        draw();
      });
      canvas.addEventListener("mouseup", () => {
        if (!drag) return;
        if (drag.kind !== "select" && (Math.abs(drag.x2 - drag.x1) > 2 || Math.abs(drag.y2 - drag.y1) > 2)) {
          annotations.push({ type: drag.kind, x1: drag.x1, y1: drag.y1, x2: drag.x2, y2: drag.y2 });
        }
        drag = null;
        document.getElementById("copy").disabled = !selection || selection.w < 1 || selection.h < 1;
        document.getElementById("undo").disabled = annotations.length === 0;
        draw();
      });

      function setMode(next) {
        mode = next;
        for (const id of ["select", "arrow", "rect"]) document.getElementById(id).classList.toggle("active", id === next);
      }
      document.getElementById("select").onclick = () => setMode("select");
      document.getElementById("arrow").onclick = () => setMode("arrow");
      document.getElementById("rect").onclick = () => setMode("rect");
      document.getElementById("undo").onclick = () => { annotations.pop(); document.getElementById("undo").disabled = annotations.length === 0; draw(); };
      document.getElementById("cancel").onclick = () => invoke("close_overlay");
      document.getElementById("copy").onclick = copySelection;

      async function copySelection() {
        if (!selection || !image) return;
        const sx = selection.x * (image.width / canvas.width);
        const sy = selection.y * (image.height / canvas.height);
        const sw = Math.max(1, Math.round(selection.w * (image.width / canvas.width)));
        const sh = Math.max(1, Math.round(selection.h * (image.height / canvas.height)));
        const output = document.createElement("canvas");
        output.width = sw; output.height = sh;
        const target = output.getContext("2d", { willReadFrequently: true });
        target.drawImage(image, sx, sy, sw, sh, 0, 0, sw, sh);
        for (const annotation of annotations) {
          const x1 = (annotation.x1 - selection.x) * (image.width / canvas.width);
          const y1 = (annotation.y1 - selection.y) * (image.height / canvas.height);
          const x2 = (annotation.x2 - selection.x) * (image.width / canvas.width);
          const y2 = (annotation.y2 - selection.y) * (image.height / canvas.height);
          target.strokeStyle = "#ff4d4d"; target.lineWidth = 3; target.beginPath();
          if (annotation.type === "arrow") {
            target.moveTo(x1, y1); target.lineTo(x2, y2);
          } else {
            target.rect(x1, y1, x2 - x1, y2 - y1);
          }
          target.stroke();
        }
        const data = target.getImageData(0, 0, sw, sh).data;
        let hex = "";
        for (const value of data) hex += value.toString(16).padStart(2, "0");
        await invoke("copy_overlay_image", { width: sw, height: sh, rgba: hex });
        await invoke("close_overlay");
      }

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") invoke("close_overlay");
        if (event.key === "Enter") copySelection();
      });

      (async () => {
        const frame = await invoke("get_overlay_frame");
        canvas.width = frame.width;
        canvas.height = frame.height;
        const bytes = Uint8ClampedArray.from({ length: frame.data.length / 2 }, (_, index) =>
          parseInt(frame.data.slice(index * 2, index * 2 + 2), 16));
        const imageData = context.createImageData(frame.width, frame.height);
        for (let index = 0, offset = 0; index < bytes.length; index += 4, offset += 4) {
          imageData.data[offset] = bytes[index + 2];
          imageData.data[offset + 1] = bytes[index + 1];
          imageData.data[offset + 2] = bytes[index];
          imageData.data[offset + 3] = 255;
        }
        context.putImageData(imageData, 0, 0);
        base = imageData;
        image = await createImageBitmap(outputCanvas(imageData));
        draw();
      })();

      function outputCanvas(data) {
        const raw = document.createElement("canvas");
        raw.width = data.width; raw.height = data.height;
        raw.getContext("2d").putImageData(data, 0, 0);
        return raw;
      }
    </script>
  </body>
</html>
