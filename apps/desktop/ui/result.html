<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Util Maker — результат</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --text: #1c2333;
        --muted: #5b6478;
        --border: #d8deea;
        --accent: #2f6fed;
        --ok: #157347;
        --error: #b42318;
        --warn: #b45309;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #1a2030; --text: #e8ecf6; --muted: #a3adc2; --border: #2c3550; --accent: #6b9bff; --ok: #5fd39a; --error: #ff8a80; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }
      main { padding: 20px 22px; }
      .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
      h1 { font-size: 16px; margin: 0; }
      .status { font-size: 12px; color: var(--ok); }
      .status.error { color: var(--error); }
      .status.warning { color: var(--warn); }
      .message { font-size: 14px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
      .meta { margin-top: 16px; color: var(--muted); font-size: 12px; line-height: 1.6; }
      button { font: inherit; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text); padding: 7px 14px; cursor: pointer; }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .actions { margin-top: 18px; display: flex; gap: 8px; flex-wrap: wrap; }
    </style>
  </head>
  <body>
    <main>
      <div class="top">
        <h1>Результат действия</h1>
        <span class="status" id="status">—</span>
      </div>
      <div class="message" id="message">Ожидание результата…</div>
      <div class="meta" id="meta"></div>
      <div class="actions">
        <button id="copy" type="button" hidden>Копировать</button>
        <button id="disable" type="button" hidden>Отключить плагин</button>
        <button id="close" type="button">Закрыть (Esc)</button>
      </div>
    </main>
    <script>
      const invoke = (command, args) => window.__TAURI__.core.invoke(command, args);

      async function refresh() {
        try {
          const result = await invoke("get_last_result");
          if (!result) {
            document.getElementById("message").textContent = "Результат ещё не получен.";
            return;
          }
          document.getElementById("message").textContent = result.message;
          const status = document.getElementById("status");
          const progress = result.status === "progress";
          const warning = result.status === "warning";
          status.textContent = progress ? "Перевод…" : result.status === "ok" ? "Успех" : warning ? "Требует действия" : "Ошибка";
          status.className = "status" + (progress || result.status === "ok" ? "" : warning ? " warning" : " error");
          document.getElementById("meta").textContent =
            `${result.moduleId} · ${result.actionName} · источник: ${result.source} · ` +
            `ядро: ${result.coreElapsedMs} мс · от события до окна: ${result.sinceEventMs} мс`;
          const copy = document.getElementById("copy");
          copy.hidden = result.status !== "ok";
          document.getElementById("close").hidden = progress;
          copy.onclick = async () => {
            try {
              await invoke("copy_text", { text: result.message });
            } catch (error) {
              document.getElementById("message").textContent = `Не удалось скопировать: ${error}`;
            }
          };
          const disable = document.getElementById("disable");
          disable.hidden = result.status === "ok" || progress || warning;
          disable.onclick = async () => {
            try {
              await invoke("set_plugin_enabled", { pluginId: result.moduleId, enabled: false });
              await invoke("close_result");
            } catch (error) {
              document.getElementById("message").textContent = `Не удалось отключить: ${error}`;
            }
          };
        } catch (error) {
          document.getElementById("message").textContent = `Не удалось прочитать результат: ${error}`;
        }
      }

      window.__umRefresh = refresh;
      document.getElementById("close").addEventListener("click", () => invoke("close_result"));
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") invoke("close_result");
      });
      window.addEventListener("DOMContentLoaded", refresh);
      refresh();
    </script>
  </body>
</html>
